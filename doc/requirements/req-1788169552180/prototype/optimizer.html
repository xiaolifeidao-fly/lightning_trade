<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台自动寻优 · 闪电量化管理端原型</title>
<link rel="stylesheet" href="assets/shell.css">
</head>
<body>
<script src="assets/shell.js"></script>
<script src="assets/chart.js"></script>
<script>
const page = renderShell('optimizer');
const INST = currentInstance();

/* ------------------------------------------------------------------
   精算结果：直接取自 docs/argus_single/study_fine.csv（2026-07-02 实测，
   1459 信号 / 23 天 / 16 路径每格）。这是真实数据，不是编的。
   三关判定：sign ≥ 0.80 · 熊市月净 p10 ≥ −56U · p90 回撤 ≤ 94U
   ------------------------------------------------------------------ */
const GATES = { sign: 0.80, bearP10: -56, p90dd: 94 };
const CELLS = [
  { mode: 'net',  cap: 26, S: 400, gate: 20, med: 142.7, sign: 1.00, lam: 2.7,  p10: -113.4, p50:  24.1, dd:  88.8 },
  { mode: 'net',  cap: 15, S: 500, gate: 20, med: 105.2, sign: 0.94, lam: 2.7,  p10: -215.9, p50: -67.2, dd:  80.1 },
  { mode: 'net',  cap: 20, S: 400, gate: 20, med: 102.0, sign: 1.00, lam: 4.1,  p10: -189.2, p50: -59.9, dd:  61.4 },
  { mode: 'net',  cap: 32, S: 350, gate: 20, med:  96.0, sign: 1.00, lam: 2.7,  p10:  -81.5, p50:  66.2, dd: 118.9 },
  { mode: 'net',  cap: 26, S: 350, gate: 20, med:  88.7, sign: 1.00, lam: 2.7,  p10: -102.4, p50:  27.3, dd:  99.2 },
  { mode: 'net',  cap: 15, S: 400, gate: 20, med:  79.9, sign: 0.69, lam: 5.5,  p10: -276.0, p50:-148.0, dd:  89.2 },
  { mode: 'dual', cap: 13, S: 500, gate: 20, med:  79.9, sign: 1.00, lam: 2.7,  p10:  -89.3, p50:  -7.3, dd:  71.3 },
  { mode: 'net',  cap: 20, S: 350, gate: 20, med:  63.5, sign: 0.69, lam: 5.5,  p10: -145.3, p50: -25.3, dd: 125.6 },
  { mode: 'dual', cap:  7, S: 400, gate: 20, med:  11.2, sign: 0.94, lam: 13.6, p10:  -75.5, p50: -26.0, dd:  49.9 },
  { mode: 'net',  cap: 15, S: 300, gate: 20, med:   6.9, sign: 0.56, lam: 10.9, p10: -220.9, p50:-125.7, dd:  97.5, incumbent: true },
];
CELLS.forEach(c => {
  c.okSign = c.sign >= GATES.sign;
  c.okBear = c.p10 >= GATES.bearP10;
  c.okDD   = c.dd  <= GATES.p90dd;
  c.pass   = c.okSign && c.okBear && c.okDD;
  c.label  = `${c.mode}(${c.cap},${c.S},g${c.gate})`;
});
const passed = CELLS.filter(c => c.pass);
const best   = CELLS.slice().sort((a, b) => b.med - a.med)[0];

/* 搜索空间（取自设计文档 §3.3） */
const AXES = [
  { k: 'cap（净仓）',    v: '10, 15, 20, 26, 32, 40, ∞', note: '∞ 仅作对照，预期违反 DD 约束' },
  { k: 'cap/侧（双向）', v: '5, 7, 10, 13',              note: '与净仓同一约束系统' },
  { k: 'S（兜底止损%）', v: '250, 300, 350, 400, 500',   note: '200 被「松兜底」护栏排除' },
  { k: 'gate 最低盈利%', v: '8, 20',                     note: '副轴，理论地板 3% + 滑点缓冲' },
  { k: 'trail 档位',     v: '固定 champion 值',          note: '防组合爆炸，列二期' },
];

page.innerHTML = `
  <div class="note">
    <b>这不是「跑很多组然后按净盈亏排序」。</b>单路径混沌达 <b>±70U</b>，点估计不可信——
    实测现行 champion <span class="mono">net(15,300)</span> 的符号一致率只有 <b>0.56（等于掷硬币）</b>，
    但它在某些单次回放里的 PnL 并不难看。所以自动寻优的核心不是搜索，是
    <b>降噪协议 + 预注册的三关判定 + 无解分支</b>。方法学取自
    <span class="mono">docs/argus_single/2026-07-02-风险参数联合重推研究设计.md</span> §3.2 / §5，
    脚本原型是 <span class="mono">backtest_capsf_study.py</span>。
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)">
    <div class="card">
      <div class="card-head"><h3>搜索空间</h3><span class="sub">粗网格 55 格</span></div>
      <div class="card-body">
        <dl class="kv" style="grid-template-columns:auto 1fr">
          ${AXES.map(a => `<dt>${a.k}</dt><dd><div class="mono" style="font-size:12px">${a.v}</div>
            <div style="color:var(--manager-text-dim);font-size:11px">${a.note}</div></dd>`).join('')}
        </dl>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>降噪协议</h3><span class="sub">每格 16 条路径</span></div>
      <div class="card-body">
        <dl class="kv">
          <dt>bar 模式</dt><dd>close / 悲观　<span style="color:var(--manager-text-dim)">×2</span></dd>
          <dt>起点偏移</dt><dd>0 / 1 / 2 / 3 天　<span style="color:var(--manager-text-dim)">×4</span></dd>
          <dt>信号随机丢弃</dt><dd>5%，2 个种子　<span style="color:var(--manager-text-dim)">×2</span></dd>
          <dt>报告口径</dt><dd>中位数 + IQR + <b>符号一致率</b></dd>
          <dt>情景重采样</dt><dd>按 episode 切块，合成熊市月 / 震荡月 / 混合月</dd>
        </dl>
        <div class="note warn" style="margin-top:12px">
          决策只依据「<b>符号一致率 ≥ 80%</b> 且中位数达标」。<br>
          频率预算按<b>熊市月情景</b>验收，不看全样本均值。
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>扫描任务</h3>
        <div class="right"><span class="chip ok"><i class="dot"></i>已完成</span></div></div>
      <div class="card-body">
        <dl class="kv">
          <dt>数据窗口</dt><dd class="mono">2026-06-09 → 07-02（23 天）</dd>
          <dt>信号流</dt><dd class="mono">1,459 条（三份导出合并交叉校验）</dd>
          <dt>K 线</dt><dd class="mono">33,196 根 1m</dd>
          <dt>粗网格</dt><dd class="mono">55 格 × 4 路径 = 220 次</dd>
          <dt>精算</dt><dd class="mono">10 格 × 16 路径 = 160 次</dd>
          <dt>总回放</dt><dd class="mono">380 次</dd>
        </dl>
        <div class="row" style="margin-top:14px">
          <button class="btn sm primary" onclick="toast('已提交后台扫描：55 格粗网格 → 自动收敛精算 10 格')">重跑扫描</button>
          <button class="btn sm" onclick="toast('已导出经验面热力图与情景分布 CSV')">导出</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="border-color:rgba(246,70,93,.34)">
    <div class="card-head">
      <h3>结论：无解分支</h3>
      <span class="sub">没有任何一格同时通过三关——按设计不硬凑参数</span>
      <div class="right"><span class="chip err"><i class="dot"></i>通过三关: ${passed.length} / ${CELLS.length}</span></div>
    </div>
    <div class="card-body">
      <div class="grid g2">
        <div class="note err" style="margin:0">
          <b>为什么不给「最优参数」：</b>10 个精算格子里
          <b>没有一格</b>同时满足「熊市月净 p10 ≥ −56U」+「p90 回撤 ≤ 94U」+「符号一致率 ≥ 0.80」。
          按预注册标准，这时候的正确输出是<b>权衡前沿 + 结构性方案立项建议</b>，
          而不是放宽标准挑一个看起来最好的。
        </div>
        <div class="note" style="margin:0">
          <b>但结论是明确的：</b>现行 <span class="mono">net(15,300)</span> 被<b>全面支配</b>——
          中位 +6.9U、符号一致率 0.56、λ_bear 10.9 次/月、熊市净 p50 −126U。
          脊线上任一格在所有指标上同时优于它。<br>
          推荐 <span class="mono">net(26,400)</span> 并把 gate 20→8（中位 142.7 → <b>168.7U</b>），
          代价是接受熊市尾部预算 ≈30%（p10 = −113U）。<b>这是需要人拍板的取舍，不是算法能替你做的决定。</b>
        </div>
      </div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">
    <div class="card">
      <div class="card-head">
        <h3>精算结果</h3>
        <span class="sub">按中位 PnL 排序 · 三关全绿才是候选</span>
        <div class="right legend">
          <span><span class="chip ok" style="padding:1px 6px;font-size:10px">Y</span> 达标</span>
          <span><span class="chip err" style="padding:1px 6px;font-size:10px">N</span> 未达标</span>
        </div>
      </div>
      <div class="card-body flush" style="overflow:auto">
        <table class="tbl">
          <thead><tr>
            <th>参数格</th><th class="num">中位 PnL/28天</th><th class="num">符号一致率</th>
            <th class="num">λ 兜底/月</th><th class="num">熊市 p10</th><th class="num">熊市 p50</th>
            <th class="num">p90 回撤</th><th>三关</th>
          </tr></thead>
          <tbody>${CELLS.map(c => `
            <tr class="${c.incumbent ? 'sel' : ''}">
              <td>
                <div class="mono" style="font-weight:600">${c.label}</div>
                ${c.incumbent ? '<div style="color:var(--manager-danger);font-size:11px">现行 champion · 被全面支配</div>' : ''}
                ${c === best ? '<div style="color:var(--manager-primary);font-size:11px">中位最高 · 但熊市 p10 未达标</div>' : ''}
              </td>
              <td class="num mono ${c.med >= 0 ? 'up' : 'down'}" style="font-weight:700">${signed(c.med, 1)}</td>
              <td class="num mono ${c.okSign ? 'up' : 'down'}">${c.sign.toFixed(2)}</td>
              <td class="num mono ${c.lam > 5 ? 'down' : ''}">${c.lam.toFixed(1)}</td>
              <td class="num mono ${c.okBear ? 'up' : 'down'}">${c.p10.toFixed(1)}</td>
              <td class="num mono ${c.p50 >= 0 ? 'up' : 'down'}">${signed(c.p50, 1)}</td>
              <td class="num mono ${c.okDD ? 'up' : 'down'}">${c.dd.toFixed(1)}</td>
              <td><div class="row" style="gap:3px;flex-wrap:nowrap">
                <span class="chip ${c.okSign ? 'ok' : 'err'}" style="padding:1px 5px;font-size:10px" title="符号一致率 ≥ 0.80">一致</span>
                <span class="chip ${c.okBear ? 'ok' : 'err'}" style="padding:1px 5px;font-size:10px" title="熊市月净 p10 ≥ −56U">熊尾</span>
                <span class="chip ${c.okDD ? 'ok' : 'err'}" style="padding:1px 5px;font-size:10px" title="p90 回撤 ≤ 94U">回撤</span>
              </div></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-head"><h3>收益 / 回撤权衡前沿</h3>
          <span class="sub">虚线 = p90 回撤上限 94U</span></div>
        <div class="card-body"><div class="chart-wrap"><canvas id="scatter"></canvas></div>
          <div class="legend" style="margin-top:10px;justify-content:center">
            <span><i style="background:#0ECB81"></i>三关全过</span>
            <span><i style="background:#F0B90B"></i>过 2 关</span>
            <span><i style="background:#F6465D"></i>过 ≤1 关</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>OOS 纪律</h3><span class="sub">防止把过拟合当成发现</span></div>
        <div class="card-body">
          <div class="timeline">
            <div class="tl-item">
              <div class="h">扫描窗口内的收益必然高估</div>
              <div class="d">+142U/28天（≈38%/月）是在<b>用于推导参数的同一窗口</b>上算的，是 in-sample。</div>
            </div>
            <div class="tl-item">
              <div class="h">参数锁定后不再调</div>
              <div class="d">用锁定<b>之后</b>新进的信号流每周复算，不重新调参。</div>
            </div>
            <div class="tl-item green">
              <div class="h">challenger 实盘即 OOS</div>
              <div class="d">先在小额账户跑 challenger 变体，通过后才晋升 champion。这正是三实例分域存在的意义。</div>
            </div>
          </div>
          <div class="note warn" style="margin-top:12px">
            <b>规模不变性破缺：</b>cap=26 的摊平动态依赖<b>绝对张数</b>。小额账户按公式只能实例化 cap≈8，
            动态接近 (10,400) 格（中位 +23、一致率 0.75、平庸）。所以 challenger
            <b>只能验证 S 效应的方向性</b>，完整参数包的收益要等晋升到大额账户才能兑现。
          </div>
        </div>
      </div>
    </div>
  </div>
`;

/* ---------- 权衡前沿散点 ---------- */
function drawScatter() {
  const cv = document.getElementById('scatter');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.parentElement.clientWidth, h = 250;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const padL = 40, padR = 12, padT = 12, padB = 30;
  const pw = w - padL - padR, ph = h - padT - padB;
  const xs = CELLS.map(c => c.dd), ys = CELLS.map(c => c.med);
  const xMin = 40, xMax = 135, yMin = 0, yMax = 160;
  const X = v => padL + (v - xMin) / (xMax - xMin) * pw;
  const Y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * ph;

  g.font = '10px ui-monospace, Menlo, monospace'; g.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * i / 4, y = Y(v);
    g.strokeStyle = 'rgba(255,255,255,.045)';
    g.beginPath(); g.moveTo(padL, y + .5); g.lineTo(padL + pw, y + .5); g.stroke();
    g.fillStyle = '#848E9C'; g.textAlign = 'right'; g.fillText(v.toFixed(0), padL - 6, y);
  }
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (let i = 0; i <= 4; i++) {
    const v = xMin + (xMax - xMin) * i / 4;
    g.fillStyle = '#848E9C'; g.fillText(v.toFixed(0), X(v), padT + ph + 6);
  }
  // 回撤上限线
  g.strokeStyle = 'rgba(246,70,93,.65)'; g.setLineDash([4, 3]); g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(X(94) + .5, padT); g.lineTo(X(94) + .5, padT + ph); g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#F6465D'; g.textAlign = 'left'; g.font = '700 10px ui-monospace, Menlo, monospace';
  g.fillText('DD 上限 94', X(94) + 4, padT + 2);

  CELLS.forEach(c => {
    const n = [c.okSign, c.okBear, c.okDD].filter(Boolean).length;
    const color = n === 3 ? '#0ECB81' : n === 2 ? '#F0B90B' : '#F6465D';
    const x = X(c.dd), y = Y(c.med);
    g.fillStyle = color; g.beginPath(); g.arc(x, y, c.incumbent ? 6 : 5, 0, 7); g.fill();
    if (c.incumbent) { g.strokeStyle = '#fff'; g.lineWidth = 1.6; g.stroke(); }
    g.fillStyle = '#B7BDC6'; g.font = '9px ui-monospace, Menlo, monospace';
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText(`${c.mode[0]}${c.cap},${c.S}`, x + 8, y);
  });
  g.fillStyle = '#5E6673'; g.font = '10px Inter, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'bottom';
  g.fillText('p90 回撤 (U) →', padL + pw / 2, h - 2);
}
drawScatter();
window.addEventListener('resize', drawScatter);
</script>
</body>
</html>
