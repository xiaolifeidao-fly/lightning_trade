# ============================================================
# item-n466643：argus_single 配置模板（唯一入库的 configs 文件）
# 用法：cp application_dev.properties application.properties 后填入真值。
#      application.properties 及 application_1/2.properties、dev.properties、
#      session.json 均被 .gitignore 排除，含明文交易所凭证，切勿入库。
# 惯例对齐 server/manager-api/configs/application_dev.properties：
#      模板入库、敏感值留空，真值只存在于本地。
# ============================================================
server.port=8855
request.path=/api
log.dir=./logs/

# ============================= 交易系统配置 =============================

# 账户数量
trade.account_count=1

# 账户1配置（做多账户，止盈止损策略）
trade.account1.name=
trade.account1.url=http://localhost:8899
trade.account1.api_key=
trade.account1.secret_key=
trade.account1.passphrase=
trade.account1.position_mode=net
trade.account1.position_side=long
trade.account1.close_strategy=sltp
trade.account1.uid=
trade.account1.InitialBalance=749
# 每次开仓张数（账户级）
trade.account1.order_size=1
# 交易方向: forward=正向跟随行情（默认，可省略）; reverse=反向对冲行情
#trade.account1.trade_direction=forward
# 交易逻辑: spread=老逻辑(根据 Binance/DeepCoin 价差立即开仓，默认); signal=新逻辑(盘口UP/DOWN信号延迟开仓)
trade.account1.trade_direction=forward
# 交易逻辑: spread=老逻辑(根据 Binance/DeepCoin 价差立即开仓，默认); signal=新逻辑(盘口UP/DOWN信号延迟开仓)
trade.account1.trade_logic=signal
# 止盈模式: 账户2作为实验组，走新的移动止盈+仓位上限+兜底止损逻辑
trade.account1.tp_mode=trailing
# 反向减仓门控: 账户2开启（仅 tp_mode=trailing 生效）。浮亏不让反向信号割肉，盈利才允许反向锁利
trade.account1.reverse_gate=on
# 大账户更紧的集中度刹车（不放到全局 20）；其余参数用全局默认
trade.account1.max_contracts_ceiling=15
trade.account1.variant=champion/default
# 全局默认开仓张数（仅当账户未配置 order_size 时回退使用）
trade.order_size=1
# 盘口信号统一延迟秒数（新逻辑使用）
trade.signal.delay_seconds=5
# 价差比较允许的最大行情年龄（毫秒）；超过则认为 Binance/DeepCoin 行情不同步，跳过比较
monitor.spread.max_price_age_ms=500

# ============================= 持仓盈亏监控配置 =============================
# 查询间隔（秒）
position.monitor.interval_seconds=5
# 盈利告警阈值（百分比，未实现盈亏/保证金 > 此值时告警）
position.monitor.profit_threshold=150
# 亏损告警阈值（百分比，未实现盈亏/保证金 < -此值时告警）
position.monitor.loss_threshold=150

# ===================== 移动止盈 / 风控配置（仅 tp_mode=trailing 账户生效）=====================
# 风险预算 f：单次最坏实亏占本金比例（%）。仓位上限 N_max = floor(min(f*E*L*100/(face*P*S), ceiling))
position.risk.budget_pct=20
# 兜底止损 S：ROI <= -此值(%) 整仓止损（S=300 ≈ 2.4% 逆向波动；历史告警样本 0 触发）
position.monitor.catastrophe_stop_pct=300
# 反向减仓门控：净仓 ROI >= 此值(%) 才允许反向信号减仓（默认20，覆盖往返手续费~15%+滑点）
position.risk.reverse_gate_min_profit_pct=20
# 仓位上限绝对天花板（张）：大账户的集中度刹车；account2(本金~98.7) 公式上限=12，不触及
position.risk.max_contracts_ceiling=20
# 合约面值（币/张），BTC=0.001
position.risk.contract_face=0.001
# 分档移动止盈：小仓(<=30%上限)激活高、回撤大(吃趋势)；大仓(>=65%上限)激活低、回撤小(快锁利)
position.monitor.trail.small_activate=150
position.monitor.trail.small_giveback=0.35
position.monitor.trail.medium_activate=90
position.monitor.trail.medium_giveback=0.28
position.monitor.trail.large_activate=40
position.monitor.trail.large_giveback=0.20
position.monitor.trail.tier_small_ratio=0.30
position.monitor.trail.tier_large_ratio=0.65


# ============================= Telegram配置 =============================
telegram.bot_token=
telegram.chat_id=

# ============================= 监控币种配置 =============================
# 格式: monitor.symbols.<SYMBOL>.deep_inst=<合约名（行情订阅用，如 BTC-USDT-SWAP）>
#       monitor.symbols.<SYMBOL>.trade_inst=<下单交易对（可选，默认等于SYMBOL，如 BTCUSDT）>
#       monitor.symbols.<SYMBOL>.threshold=<阈值>
#       monitor.symbols.<SYMBOL>.signal_threshold=<盘口信号阈值（LastPrice/MarkedPrice 偏离比例，新逻辑使用）>
monitor.symbols.BTCUSDT.deep_inst=BTC-USDT-SWAP
monitor.symbols.BTCUSDT.trade_inst=BTCUSDT
monitor.symbols.BTCUSDT.threshold=0.001
monitor.symbols.BTCUSDT.signal_threshold=0.0005
#monitor.symbols.ETHUSDT.deep_inst=ETH-USDT-SWAP
#monitor.symbols.ETHUSDT.trade_inst=ETHUSDT
#monitor.symbols.ETHUSDT.threshold=0.001
#monitor.symbols.ETHUSDT.signal_threshold=0.0005

