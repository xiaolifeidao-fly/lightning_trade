# 8491 与三处对齐：script start.sh 的 PORT 预检、前端产物里构建期固化的
# SERVER_TARGET=http://127.0.0.1:8491（见 client/manager next.config.mjs 的 env）。
# 改这个端口必须同时重新构建前端，否则前端代理会 504。该端口只走回环，不必对外开放。
server.port=8491
request.path=/api

sqlconn = 
log.dir=./logs/

redis.addr = 
redis.password = 


# Argus 配置分域：管理端未显式传 instanceKey 时使用的默认实例键，
# 取值需与 argus_single 各自 properties 里的 argus.instance.id 一致。
argus.instance.default_key = argus-single-roc
